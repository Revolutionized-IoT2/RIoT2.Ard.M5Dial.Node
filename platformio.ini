; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-stamps3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
build_unflags =
	-std=gnu++11
build_flags = 
	-std=gnu++14
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DMQTT_MAX_PACKET_SIZE=512
	; Optional first-boot defaults, seeded into NVS (Preferences) if no NodeConfig
	; is stored yet. Remove once Phase 2 provisioning UX exists. Uncomment and
	; fill in to test Phase 1 connectivity without a provisioning flow:
	; -D'DEFAULT_NODE_ID="98D067AB-9672-45D1-81DF-110B4B82455D"'
	; -D'DEFAULT_NODE_NAME="M5Dial Node"'
	; -D'DEFAULT_WIFI_SSID="your-ssid"'
	; -D'DEFAULT_WIFI_PASSWORD="your-password"'
	; -D'DEFAULT_MQTT_SERVER_URL="192.168.1.10:1883"'
	; -D'DEFAULT_MQTT_USERNAME=""'
	; -D'DEFAULT_MQTT_PASSWORD=""'
monitor_speed = 115200
lib_deps = 
	m5stack/M5Dial
	m5stack/M5Unified@^0.2.18
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.1.0
